<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TON Overlords</title>
    <style>
        body { font-family: monospace; background: #05060a; color: white; margin: 0; padding: 15px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
        .screen { display: none; flex: 1; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .screen.active { display: flex; }
        .btn { background: #00f2fe; border: none; color: black; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 15px; text-transform: uppercase; }
        .res-panel { display: flex; justify-content: space-around; background: #121422; padding: 10px; border-radius: 8px; margin-bottom: 10px; font-size: 14px; }
        #chat-box { flex: 1; background: #0d0e15; border-radius: 6px; padding: 10px; overflow-y: auto; font-size: 12px; margin-bottom: 8px; text-align: left; }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: ИНТРО -->
    <div class="screen active" id="scr-intro">
        <div id="intro-text" style="font-size:14px; line-height:1.6; max-width:300px;"></div>
        <button class="btn" id="btn-next" style="display:none;" onclick="showRaceScreen()">Вступить в игру ⚔️</button>
    </div>

    <!-- ЭКРАН 2: ВЫБОР РАСЫ -->
    <div class="screen" id="scr-race">
        <h2>ВЫБЕРИТЕ СВОЮ РАСУ</h2>
        <button class="btn" onclick="setRace('Люди 👑')">👑 Люди</button>
        <button class="btn" onclick="setRace('Эльфы 🧝')">🧝 Эльфы</button>
        <button class="btn" onclick="setRace('Орки 🧌')">🧌 Орки</button>
        <button class="btn" onclick="setRace('Гномы 🧔')">🧔 Гномы</button>
    </div>

    <!-- ЭКРАН 3: ГЛАВНАЯ ИГРА -->
    <div class="screen" id="scr-game">
        <div class="res-panel" style="width: 100%;">
            <div>🪙 Золото: <span id="gold">100</span></div>
            <div>💎 Кристаллы: <span id="crystal">20</span></div>
        </div>
        <h3 id="race-badge">Раса: Путник</h3>
        <button class="btn" style="background:#ff007a; color:white; width:120px; height:120px; border-radius:50%; font-size:30px;" onclick="mineCrystal()">🌋</button>
        
        <!-- ВСТРОЕННЫЙ ИИ-ЧАТ ТАВЕРНЫ -->
        <h4 style="margin: 15px 0 5px 0; color:#00f2fe;">🧙‍♂️ Чат с Хозяином Таверны (ИИ)</h4>
        <div id="chat-box"></div>
        <div style="display:flex; width:100%; gap:5px;">
            <input type="text" id="chat-input" placeholder="Напишите ИИ..." style="flex:1; background:#121422; border:1px solid #24273e; color:white; padding:8px; border-radius:6px;">
            <button class="btn" style="margin:0; padding:0 15px;" onclick="sendToAI()">▶</button>
        </div>
    </div>

    <script>
        // 🚨 ШАГ 3 ИНСТРУКЦИИ: Сюда впиши актуальную ссылку из черного окна ngrok!
        const API_URL = "https://ngrok-free.dev"; 
        
        let gold = 100, crystal = 20, playerRace = "";
        const story = ["« В начале времен сеть TON была чистой энергией... »", "« Шесть рас сошлись в тотальной Войне Сезонов за Глобальный Призовой Фонд. »", "« Пропиши свое имя в истории этой крипто-вселенной... »"];
        let line = 0, char = 0;

        function typeStory() {
            let box = document.getElementById("intro-text");
            if(line >= story.length) { document.getElementById("btn-next").style.display = "block"; return; }
            box.innerHTML = ""; char = 0;
            function print() {
                if(char < story[line].length) { box.innerHTML += story[line].charAt(char); char++; setTimeout(print, 30); }
                else { line++; setTimeout(typeStory, 2000); }
            }
            print();
        }
        typeStory();

        function showRaceScreen() { document.getElementById("scr-intro").classList.remove("active"); document.getElementById("scr-race").classList.add("active"); }
        
        async function setRace(race) {
            playerRace = race; document.getElementById("race-badge").innerText = "Раса: " + race;
            document.getElementById("scr-race").classList.remove("active"); document.getElementById("scr-game").classList.add("active");
            // Отправляем выбор на сервер
            await fetch(API_URL + "/api/choose_race", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({user_id:777, race:race}) });
        }

        function mineCrystal() { crystal += 1; gold += 5; document.getElementById("gold").innerText = gold; document.getElementById("crystal").innerText = crystal; }

        async function sendToAI() {
            let input = document.getElementById("chat-input"); let t = input.value.trim(); if(!t) return;
            let box = document.getElementById("chat-box");
            box.innerHTML += "<div><b>Вы:</b> " + t + "</div>"; input.value = "";
            
            // Запрос к нашему ИИ-серверу Python
            let r = await fetch(API_URL + "/api/ai/chat?user_id=777&user_message=" + encodeURIComponent(t), {method:"POST"});
            let d = await r.json();
            box.innerHTML += "<div style='color:#00f2fe;'><b>🧙‍♂️ ИИ:</b> " + d.text + "</div>";
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
