<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TON Overlords</title>
    <style>
        :root { --bg-color: #05060a; --panel-color: rgba(18, 20, 32, 0.85); --gold: #ffdf00; --crystal: #00f2fe; --iron: #a8b2bd; --war: #ff3366; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: var(--bg-color); color: white; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; user-select: none; }
        .resources-panel { display: flex; justify-content: space-around; background: var(--panel-color); backdrop-filter: blur(15px); padding: 12px; border-bottom: 4px solid rgba(255,255,255,0.05); margin-top: 20px; }
        .res-item { display: flex; align-items: center; gap: 6px; font-weight: bold; font-size: 14px; }
        .screen { display: none; flex: 1; flex-direction: column; align-items: center; padding: 15px; overflow-y: auto; box-sizing: border-box; }
        .screen.active { display: flex; }
        .drill-btn { width: 140px; height: 140px; border-radius: 50%; background: #121422; border: 4px solid var(--crystal); box-shadow: 0 0 25px rgba(0,242,254,0.2); cursor: pointer; font-size: 45px; display: flex; align-items: center; justify-content: center; outline: none; margin: 25px 0; transition: transform 0.05s; }
        .drill-btn:active { transform: scale(0.93); }
        .map-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; max-width: 360px; }
        .building-card { background: var(--panel-color); border: 1px solid rgba(255,255,255,0.06); border-radius: 14px; padding: 10px; text-align: center; }
        .upgrade-btn, .btn-attack { width: 100%; background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%); border: none; color: black; padding: 8px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 5px; box-sizing: border-box; }
        .btn-attack { background: linear-gradient(135deg, #ff3366 0%, #ff6b6b 100%); color: white; text-transform: uppercase; }
        .nav-bar { background: #0a0b12; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid rgba(255,255,255,0.05); z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; color: #5f6377; font-size: 10px; cursor: pointer; flex: 1; }
        .nav-item.active { color: var(--crystal); }
        .chat-tab-btn { flex: 1; background: transparent; border: none; border-radius: 6px; padding: 5px; color: #5f6377; font-size: 10px; font-weight: bold; cursor: pointer; }
        .shake-effect { animation: shake 0.1s infinite; }
        @keyframes shake { 0%, 100% { transform: translate(0, 0); } 20% { transform: translate(-2px, 1px); } 40% { transform: translate(1px, -2px); } 60% { transform: translate(-1px, 2px); } 80% { transform: translate(2px, -1px); } }
    </style>
</head>
<body>

    <!-- ТЕКСТОВОЕ ВСТУПИТЕЛЬНОЕ ИНТРО ЛЕГЕНДЫ -->
    <div id="game-intro-screen" style="position: fixed; top:0; left:0; width:100%; height:100%; background:#050608; z-index:100000; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:30px; box-sizing:border-box; text-align:center;">
        <div id="intro-text-container" style="color:#e0e6ed; font-size:14px; line-height:1.7; max-width:320px; font-family:monospace; min-height:150px;"></div>
        <button id="btn-skip-intro" style="display:none;" class="upgrade-btn" onclick="closeIntroAndProceed()">Принять вызов ⚔️</button>
    </div>

    <!-- ОВЕРЛЕЙ ВЫБОРА РАСЫ -->
    <div id="race-selection-screen" style="position: fixed; top:0; left:0; width:100%; height:100%; background:#07080c; z-index:9999; display:none; flex-direction:column; align-items:center; justify-content:center; padding:20px;">
        <h2 style="margin-bottom:20px;">Выберите Расу</h2>
        <div style="display:grid; grid-template-columns:repeat(2,1fr); gap:12px; width:100%; max-width:360px;">
            <button onclick="selectRace('Люди 👑')" style="background:#1c1a0e; border:1px solid #ffd700; color:white; padding:12px; border-radius:12px; font-weight:bold;">👑 Люди</button>
            <button onclick="selectRace('Эльфы 🧝')" style="background:#0b191c; border:1px solid #00f2fe; color:white; padding:12px; border-radius:12px; font-weight:bold;">🧝 Эльфы</button>
            <button onclick="selectRace('Орки 🧌')" style="background:#1c0e12; border:1px solid #ff3366; color:white; padding:12px; border-radius:12px; font-weight:bold;">🧌 Орки</button>
            <button onclick="selectRace('Гномы 🧔')" style="background:#1c1512; border:1px solid #cd7f32; color:white; padding:12px; border-radius:12px; font-weight:bold;">🧔 Гномы</button>
            <button onclick="selectRace('Охотники 🏹')" style="background:#0f1c0e; border:1px solid #2ecc71; color:white; padding:12px; border-radius:12px; font-weight:bold;">🏹 Охотники</button>
            <button onclick="selectRace('Древоходы 🌳')" style="background:#19121c; border:1px solid #9b59b6; color:white; padding:12px; border-radius:12px; font-weight:bold;">🌳 Древоходы</button>
        </div>
    </div>

    <!-- ВЕРХНЯЯ ПАНЕЛЬ РЕСУРСОВ -->
    <div class="resources-panel">
        <div class="res-item" style="color:var(--gold);">🪙 <span id="res-gold">0</span></div>
        <div class="res-item" style="color:var(--crystal);">💎 <span id="res-crystal">0</span></div>
        <div class="res-item" style="color:var(--iron);">⚙️ <span id="res-iron">0</span></div>
    </div>

    <!-- ПОЛОСА УРОВНЯ АККАУНТА -->
    <div style="width:90%; max-width:360px; margin: 10px auto 0 auto; background:var(--panel-color); padding:8px; border-radius:10px; display:flex; align-items:center; gap:10px; box-sizing:border-box;">
        <div style="background:linear-gradient(135deg, #ff007a, #7928ca); width:28px; height:28px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:12px;" id="player-level-badge">1</div>
        <div style="flex:1;">
            <div style="display:flex; justify-content:space-between; font-size:10px; color:#a8b2bd; margin-bottom:2px;"><span id="xp-text">0 / 100 XP</span></div>
            <div style="width:100%; height:4px; background:#0d0e15; border-radius:2px; overflow:hidden;"><div id="xp-progress-bar" style="width:0%; height:100%; background:#ff007a;"></div></div>
        </div>
    </div>

    <!-- ЭКРАН 1: ДОБЫЧА -->
    <div class="screen active" id="screen-mine">
        <button class="drill-btn" id="drill-trigger">🌋</button>
        <div style="width:100%; max-width:320px; background:var(--panel-color); padding:10px; border-radius:10px; text-align:center;">
            <div style="font-size:11px; color:#a8b2bd; display:flex; justify-content:space-between; margin-bottom:4px;"><span>Склад (Макс 3ч)</span><span id="storage-timer">0%</span></div>
            <div style="width:100%; height:6px; background:#0d0e15; border-radius:3px; overflow:hidden; margin-bottom:8px;"><div id="storage-bar" style="width:0%; height:100%; background:var(--crystal);"></div></div>
            <button class="upgrade-btn" style="background:#24273e; color:white; margin:0;" onclick="claimStorageResources()">Собрать на Склад</button>
        </div>
    </div>

    <!-- ЭКРАН 2: КАРТА -->
    <div class="screen" id="screen-map">
        <div class="map-grid">
            <div class="building-card">
                <div id="gold-mine-visual" style="font-size:28px; margin-bottom:4px;">🪵</div>
                <div style="font-size:12px; font-weight:bold;">Шахта Золота</div>
                <button class="upgrade-btn" onclick="upgradeBuilding('gold')">Апгрейд</button>
            </div>
            <div class="building-card">
                <div id="iron-mine-visual" style="font-size:28px; margin-bottom:4px;">❌</div>
                <div style="font-size:12px; font-weight:bold;">Завод Железа</div>
                <button class="upgrade-btn" onclick="upgradeBuilding('iron')">Построить</button>
            </div>
        </div>
    </div>

    <!-- ЭКРАН 3: ПОДЗЕМЕЛЬЕ -->
    <div class="screen" id="screen-battle">
        <canvas id="dungeonCanvas" width="300" height="180" style="background:#0c0d14; border-radius:10px; display:block; margin-bottom:10px;"></canvas>
        <div id="npc-dialogue-box" style="background:rgba(255,255,255,0.02); padding:8px; border-radius:6px; font-size:11px; font-family:monospace; width:100%; max-width:300px; margin-bottom:10px;">📜 Двигайтесь по стрелкам, ищите NPC и бейте мобов [🎯].</div>
        <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:4px; width:120px;">
            <div></div><button onclick="moveHero(0,-20)" style="background:#1e2032; border:none; color:white; padding:8px; border-radius:6px;">▲</button><div></div>
            <button onclick="moveHero(-20,0)" style="background:#1e2032; border:none; color:white; padding:8px; border-radius:6px;">◀</button>
            <button onclick="interactAction()" style="background:#2ecc71; border:none; color:black; padding:8px; border-radius:6px; font-weight:bold;">🎯</button>
            <button onclick="moveHero(20,0)" style="background:#1e2032; border:none; color:white; padding:8px; border-radius:6px;">▶</button>
            <div></div><button onclick="moveHero(0,20)" style="background:#1e2032; border:none; color:white; padding:8px; border-radius:6px;">▼</button><div></div>
        </div>
    </div>

    <!-- ЭКРАН 4: ТАВЕРНА -->
    <div class="screen" id="screen-hub">
        <canvas id="hubCanvas" width="320" height="200" style="background:#090a10; border-radius:12px; border:1px solid #ff007a; margin-bottom:10px;"></canvas>
        <div style="display:flex; gap:6px; width:100%; max-width:320px; margin-bottom:6px;">
